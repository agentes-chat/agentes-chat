<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentes.chat</title>
    <!-- The sky's deepest tone before anything else paints (cover.rs paints the same behind it). -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="cover" data-tauri-drag-region>
      <canvas class="cover__sky" aria-hidden="true"></canvas>
      <div class="cover__in">
        <canvas class="cover__agent" aria-hidden="true"></canvas>
        <p class="cover__word" aria-label="agentes.chat">agentes<span>.chat</span></p>
        <p class="cover__line" role="status" aria-live="polite"></p>
        <p class="cover__time" aria-hidden="true"></p>
        <div class="cover__acts"></div>
      </div>
      <!-- A workspace on a private network this computer can't reach now: what turns the network on (ADR 0265). -->
      <section class="cover__card" hidden>
        <span class="cover__tile" aria-hidden="true"></span>
        <h2 class="cover__title"></h2>
        <p class="cover__lead"></p>
        <p class="cover__note" role="status" aria-live="polite"></p>
        <div class="cover__cardacts"></div>
      </section>
    </main>
    <script type="module" src="/src/cover/main.ts"></script>
  </body>
</html>
