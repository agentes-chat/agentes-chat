<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentes.chat</title>
    <!-- The sky's deepest tone before anything else paints (cover.rs paints the same behind it). -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="cover" data-tauri-drag-region>
      <canvas class="cover__sky" aria-hidden="true"></canvas>
      <!-- One stack for every state (ADR 0265): the picture, a title, one line, at most two buttons and a link. The
           picture is the agent, or Tailscale's mark over a workspace on a private network this computer can't reach. -->
      <div class="cover__in">
        <div class="cover__pic" aria-hidden="true">
          <canvas class="cover__agent"></canvas>
          <span class="cover__tile"></span>
        </div>
        <h1 class="cover__title"><span class="cover__word" aria-label="agentes.chat">agentes<span>.chat</span></span></h1>
        <p class="cover__line" role="status" aria-live="polite"></p>
        <p class="cover__time" aria-hidden="true"></p>
        <div class="cover__acts"></div>
        <div class="cover__more"></div>
      </div>
    </main>
    <script type="module" src="/src/cover/main.ts"></script>
  </body>
</html>
