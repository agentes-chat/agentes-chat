name: Container

# Builds the app image on this repository's self-hosted runner (Settings > Actions > Runners: the
# labels self-hosted, Linux, X64) and pushes it to this repository's GitHub Container Registry, on
# every push. Nothing here needs a secret: GITHUB_TOKEN pushes to ghcr.io with packages: write.
#
# The image is ghcr.io/<owner>/<repo>:<branch, tag, sha-...> and :latest on the default branch.
# The first push creates the package private: make it public in the package's settings, or sign the
# server in with a token that has read:packages (`docker login ghcr.io`).
#
# The runner builds with its own Docker and all of its CPUs. On a small machine the manual
# `systemd-run ... docker build` remains the capped way to build; this workflow has a two-hour
# timeout and cancels an older build of the same ref.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    # The runner registered for this repository. Change these labels if the runner's differ.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the image
        # GHCR wants lowercase: owner and repository, lowercased.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: The runner
        run: |
          docker version --format 'docker {{.Server.Version}}'
          df -h / | tail -1
          free -h | head -2
          nproc

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder runs on the same machine as the runner: give it 1.5 CPUs and 5 GB, so a
          # build cannot take the whole notebook again.
          driver-opts: |
            memory=5g
            memory-swap=6g
            cpu-quota=150000
            cpu-period=100000

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=agentes.chat
            org.opencontainers.image.description=People and AI agents working together in one workspace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One manifest, so a plain docker/compose pull gets it without attestation handling.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max,ignore-error=true

      - name: Make the package public
        # Best effort: a token without packages: write leaves it private, and the server can still
        # pull it after `docker login ghcr.io`. The build itself must not fail over this.
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/agentes-chat" \
            -d '{"visibility":"public"}'

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo '```'
            echo "$IMAGE"
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
            echo
            echo "Pull it with: docker pull $IMAGE:latest"
          } >> "$GITHUB_STEP_SUMMARY"
